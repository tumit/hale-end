[plugins]
fnox-env = "https://github.com/jdx/mise-env-fnox"

[tools]
fnox = "latest"
java = "jetbrains-25"
node = "26"

[env]
_.fnox-env = { tools = true }

[tasks.feInit]
description = "Initialize Vite React TypeScript project"
run = """
npm create vite@latest frontend -- --template react-ts --no-interactive
"""

[tasks.feTailwind]
description = "Install and configure Tailwind CSS"
depends = ["feInit"]
run = """
cd frontend && npm add -D tailwindcss @tailwindcss/vite
"""

[tasks.feTest]
description = "Install unit testing libraries"
depends = ["feTailwind"]
run = """
cd frontend && npm add -D vitest jsdom @testing-library/react @testing-library/jest-dom @testing-library/user-event
"""

[tasks.feSetup]
description = "Full frontend setup"
depends = ["feInit", "feTailwind", "feTest"]
run = "echo 'Frontend setup completed'"

[tasks.fe]
description = "Start frontend dev server"
run = "cd frontend && npm run dev"

[tasks.be]
description = "Start backend dev server"
run = "cd backend && ./gradlew bootRun"

[tasks.dev]
description = "Start frontend and backend dev servers"
depends = ["fe", "be"]
